<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffe4e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title> dear Said chikouri</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(145deg, #fff0f5 0%, #ffe4e9 100%);
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 0.75rem;
            padding-top: max(0.75rem, env(safe-area-inset-top));
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
            padding-left: max(0.75rem, env(safe-area-inset-left));
            padding-right: max(0.75rem, env(safe-area-inset-right));
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
        }

        /* floating balloons & hearts container */
        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .balloon, .heart-float, .sparkle {
            position: absolute;
            animation: floatUp 10s infinite linear;
            opacity: 0.5;
            font-size: 2rem;
            user-select: none;
            will-change: transform, opacity;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(110vh) rotate(0deg) scale(0.8);
                opacity: 0.15;
            }
            50% {
                opacity: 0.65;
            }
            100% {
                transform: translateY(-20vh) rotate(20deg) scale(1.05);
                opacity: 0.05;
            }
        }

        /* main card */
        .card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(230, 120, 150, 0.25), 0 8px 20px rgba(200, 80, 120, 0.15), inset 0 2px 8px rgba(255, 255, 255, 0.8);
            padding: 2.2rem 1.5rem;
            max-width: 700px;
            width: 100%;
            max-height: 95dvh;
            text-align: center;
            position: relative;
            z-index: 10;
            border: 2px solid rgba(255, 220, 230, 0.9);
            animation: softGlow 4s infinite alternate;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @keyframes softGlow {
            0% { box-shadow: 0 20px 40px rgba(230, 130, 160, 0.2), 0 8px 20px rgba(220, 100, 140, 0.1); }
            100% { box-shadow: 0 25px 50px rgba(240, 150, 180, 0.4), 0 10px 30px rgba(230, 120, 160, 0.25); }
        }

        .names {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #b3405a;
            text-shadow: 0 2px 10px rgba(255, 200, 220, 0.8);
        }

        .names span {
            display: inline-block;
            background: linear-gradient(135deg, #d64b6b, #b82e4f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
            filter: drop-shadow(0 4px 8px rgba(255, 180, 200, 0.5));
        }

        .names .divider {
            font-size: 1.8rem;
            color: #e6839b;
            filter: drop-shadow(0 2px 6px rgba(255, 150, 180, 0.6));
            animation: pulseHeart 1.8s infinite;
        }

        @keyframes pulseHeart {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .question {
            font-size: 1.7rem;
            font-weight: 500;
            line-height: 1.4;
            margin: 1.2rem 0 1.8rem;
            color: #6b2e3f;
            background: linear-gradient(to right, #9e3b55, #c15a78);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(255, 200, 220, 0.5);
            padding: 0 0.3rem;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 0.5rem;
            position: relative;
            min-height: 100px;
            touch-action: manipulation;
        }

        .btn {
            font-size: 1.5rem;
            font-weight: 600;
            padding: 0.8rem 2.2rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 18px rgba(200, 100, 130, 0.3);
            position: relative;
            z-index: 20;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .btn-yes {
            background: linear-gradient(145deg, #ff9ab5, #ff7b9c);
            color: white;
            text-shadow: 0 2px 6px rgba(180, 60, 90, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .btn-yes:active {
            transform: scale(0.96);
            background: linear-gradient(145deg, #ff8aa8, #ff6b8f);
            box-shadow: 0 6px 14px rgba(240, 100, 140, 0.4);
        }

        .btn-no {
            background: linear-gradient(145deg, #f8cdd8, #f0b8c6);
            color: #8f4a5e;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 6px 14px rgba(200, 130, 150, 0.25);
            position: relative;
            cursor: default;
            pointer-events: auto;
            touch-action: none;
        }

        /* message after YES */
        .final-message {
            font-size: 1.5rem;
            font-weight: 600;
            color: #a1304b;
            margin-top: 1.2rem;
            padding: 0.9rem 1.2rem;
            background: rgba(255, 240, 245, 0.85);
            border-radius: 50px;
            display: inline-block;
            box-shadow: 0 8px 22px rgba(210, 120, 150, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #ffd9e2;
            line-height: 1.45;
            max-width: 100%;
            word-wrap: break-word;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            80% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        .hidden {
            display: none !important;
        }

        .btn-no.moved {
            transition: transform 0.12s ease-out, left 0.12s ease-out, top 0.12s ease-out;
        }

        .sparkle {
            font-size: 1.4rem;
            animation-duration: 8s;
            opacity: 0.6;
        }

        /* ===== TABLET ===== */
        @media (max-width: 600px) {
            .card {
                padding: 1.8rem 1.1rem;
                border-radius: 36px;
            }
            .names {
                font-size: 1.5rem;
                gap: 0.35rem;
            }
            .names .divider {
                font-size: 1.4rem;
            }
            .question {
                font-size: 1.35rem;
                margin: 1rem 0 1.4rem;
            }
            .btn {
                font-size: 1.3rem;
                padding: 0.75rem 1.8rem;
            }
            .button-group {
                gap: 1rem;
                min-height: 90px;
            }
            .final-message {
                font-size: 1.25rem;
                padding: 0.8rem 1rem;
            }
        }

        /* ===== SMALL PHONES ===== */
        @media (max-width: 420px) {
            body {
                padding: 0.5rem;
            }
            .card {
                padding: 1.5rem 0.9rem;
                border-radius: 30px;
                max-height: 96dvh;
            }
            .names {
                font-size: 1.25rem;
                gap: 0.3rem;
            }
            .names .divider {
                font-size: 1.2rem;
            }
            .question {
                font-size: 1.15rem;
                margin: 0.9rem 0 1.2rem;
                line-height: 1.35;
            }
            .btn {
                font-size: 1.1rem;
                padding: 0.7rem 1.5rem;
            }
            .button-group {
                gap: 0.8rem;
                min-height: 80px;
            }
            .final-message {
                font-size: 1.05rem;
                padding: 0.7rem 0.9rem;
            }
        }

        /* ===== VERY SMALL / NARROW ===== */
        @media (max-width: 340px) {
            .names {
                font-size: 1.05rem;
            }
            .question {
                font-size: 1rem;
            }
            .btn {
                font-size: 0.95rem;
                padding: 0.6rem 1.2rem;
            }
            .final-message {
                font-size: 0.95rem;
            }
        }

        /* ===== LANDSCAPE MOBILE ===== */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 0.5rem;
            }
            .card {
                padding: 1rem 1.2rem;
                border-radius: 30px;
                max-height: 98dvh;
            }
            .names {
                font-size: 1.2rem;
                margin-bottom: 0.2rem;
            }
            .question {
                font-size: 1.05rem;
                margin: 0.6rem 0 0.8rem;
            }
            .btn {
                font-size: 1rem;
                padding: 0.55rem 1.4rem;
            }
            .button-group {
                min-height: 70px;
                gap: 0.8rem;
            }
            .final-message {
                font-size: 1rem;
                padding: 0.6rem 0.9rem;
                margin-top: 0.7rem;
            }
        }

        /* reduce motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            .balloon, .heart-float, .sparkle {
                animation: none;
                opacity: 0.3;
            }
            .card {
                animation: none;
            }
            .names .divider {
                animation: none;
            }
        }
    </style>
</head>
<body>

    <!-- floating balloons, hearts, sparkles -->
    <div class="floating-elements" id="floatingContainer"></div>

    <div class="card" id="mainCard">
        <div class="names">
            <span>Said Moussouni</span>
            <span class="divider"></span>
            <span>chikouri</span>
        </div>

        <div class="question">
            Said Moussouni, will you be in my life forever? 💗
        </div>

        <div class="button-group" id="buttonGroup">
            <button class="btn btn-yes" id="yesBtn">Yes 💖</button>
            <button class="btn btn-no" id="noBtn">No 🙈</button>
        </div>

        <div id="messageContainer" style="margin-top: 0.5rem;"></div>
    </div>

    <script>
        (function() {
            // ---------- FLOATING ELEMENTS (reduced on mobile for perf) ----------
            const floatContainer = document.getElementById('floatingContainer');
            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            const isSmall = window.innerWidth < 420;
            // Reduce count on mobile for smooth performance
            const total = isSmall ? 12 : (isMobile ? 18 : 28);

            const pickups = ['🎈', '💕', '✨', '🌸', '💖', '🎈', '💗', '⭐', '🩷', '💐', '✨', '💞'];

            for (let i = 0; i < total; i++) {
                const el = document.createElement('div');
                const rand = Math.random();
                if (rand < 0.4) {
                    el.classList.add('balloon');
                    el.textContent = '🎈';
                } else if (rand < 0.75) {
                    el.classList.add('heart-float');
                    el.textContent = ['💕', '💖', '💗', '💓', '❤️', '🩷', '💞'][Math.floor(Math.random() * 7)];
                } else {
                    el.classList.add('sparkle');
                    el.textContent = ['✨', '⭐', '🌟', '💫'][Math.floor(Math.random() * 4)];
                }
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (1 + Math.random() * (isSmall ? 1.2 : 1.8)) + 'rem';
                el.style.animationDuration = (8 + Math.random() * 8) + 's';
                el.style.animationDelay = (Math.random() * 10) + 's';
                el.style.opacity = 0.2 + Math.random() * 0.45;
                floatContainer.appendChild(el);
            }

            // ---------- NO BUTTON RUNS AWAY (touch optimized) ----------
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            const buttonGroup = document.getElementById('buttonGroup');
            const messageContainer = document.getElementById('messageContainer');

            // Initialize button group as relative positioning context
            buttonGroup.style.position = 'relative';
            noBtn.style.position = 'relative';
            noBtn.style.left = '0px';
            noBtn.style.top = '0px';

            // Track last move time to avoid excessive rapid jumps
            let lastMove = 0;
            const MOVE_COOLDOWN = 80; // ms

            // "run away" function: reposition the No button within the button group area
            function moveNoButton(e) {
                // prevent default on touch events
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                const now = Date.now();
                if (now - lastMove < MOVE_COOLDOWN) return;
                lastMove = now;

                const groupRect = buttonGroup.getBoundingClientRect();
                const btnRect = noBtn.getBoundingClientRect();

                // Padding inside group
                const padding = 8;

                // Available space inside button group
                const maxLeft = Math.max(0, groupRect.width - btnRect.width - padding * 2);
                const maxTop = Math.max(0, groupRect.height - btnRect.height - padding * 2);

                let newLeft, newTop;

                if (maxLeft > 10 && maxTop > 10) {
                    // pick a random spot, but avoid the current position a bit for a "jump" feel
                    let attempts = 0;
                    do {
                        newLeft = padding + Math.random() * maxLeft;
                        newTop = padding + Math.random() * maxTop;
                        attempts++;
                    } while (attempts < 3 && Math.abs(newLeft - (btnRect.left - groupRect.left)) < 30 && Math.abs(newTop - (btnRect.top - groupRect.top)) < 30);
                } else {
                    // fallback: small random offset
                    newLeft = (Math.random() * 60 - 30);
                    newTop = (Math.random() * 40 - 20);
                    noBtn.style.position = 'relative';
                    noBtn.style.left = newLeft + 'px';
                    noBtn.style.top = newTop + 'px';
                    noBtn.style.transform = `rotate(${(Math.random() * 16 - 8).toFixed(1)}deg) scale(0.97)`;
                    return;
                }

                // Apply absolute positioning within group
                noBtn.style.position = 'absolute';
                noBtn.style.left = newLeft + 'px';
                noBtn.style.top = newTop + 'px';

                // playful rotation
                const rotate = (Math.random() * 18 - 9).toFixed(1);
                noBtn.style.transform = `rotate(${rotate}deg) scale(0.97)`;

                // keep yes button above
                yesBtn.style.position = 'relative';
                yesBtn.style.zIndex = '30';
            }

            // --- Touch events (primary on mobile) ---
            noBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                moveNoButton(e);
            }, { passive: false });

            noBtn.addEventListener('touchmove', (e) => {
                e.preventDefault();
            }, { passive: false });

            noBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, { passive: false });

            // --- Mouse events (desktop) ---
            noBtn.addEventListener('mouseenter', moveNoButton);
            noBtn.addEventListener('mousemove', moveNoButton);
            noBtn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                moveNoButton(e);
            });
            noBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                moveNoButton(e);
            });

            // --- Pointer events (unified) - but careful not to double-fire ---
            // We use pointerdown as a safety net
            noBtn.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'touch') return; // already handled by touchstart
                e.preventDefault();
                e.stopPropagation();
                moveNoButton(e);
            });

            // Prevent any focus on the No button
            noBtn.addEventListener('focus', (e) => {
                noBtn.blur();
            });

            // reposition on resize and orientation change
            function repositionNoButton() {
                if (noBtn.style.position === 'absolute') {
                    // Reset to a safe spot within the group
                    const groupRect = buttonGroup.getBoundingClientRect();
                    const btnRect = noBtn.getBoundingClientRect();
                    const padding = 8;
                    const maxLeft = Math.max(0, groupRect.width - btnRect.width - padding * 2);
                    const maxTop = Math.max(0, groupRect.height - btnRect.height - padding * 2);
                    if (maxLeft > 10 && maxTop > 10) {
                        noBtn.style.left = (padding + Math.random() * maxLeft) + 'px';
                        noBtn.style.top = (padding + Math.random() * maxTop) + 'px';
                    } else {
                        noBtn.style.left = '0px';
                        noBtn.style.top = '0px';
                        noBtn.style.position = 'relative';
                    }
                }
            }

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(repositionNoButton, 150);
            });

            window.addEventListener('orientationchange', () => {
                setTimeout(repositionNoButton, 250);
            });

            // ---------- YES BUTTON: show romantic message ----------
            yesBtn.addEventListener('click', (e) => {
                e.preventDefault();

                // Hide no button with fade
                noBtn.style.transition = 'opacity 0.4s, transform 0.4s';
                noBtn.style.opacity = '0';
                noBtn.style.pointerEvents = 'none';
                noBtn.style.transform = 'scale(0.5) rotate(20deg)';

                setTimeout(() => {
                    noBtn.style.display = 'none';
                }, 400);

                // Dim yes button
                yesBtn.style.transform = 'scale(0.95)';
                yesBtn.style.opacity = '0.85';
                yesBtn.style.pointerEvents = 'none';

                // Show final message
                messageContainer.innerHTML = `
                    <div class="final-message">
                        I knew it! ❤️ netmskher berk.
                    </div>
                `;

                // Add extra sparkle burst (reduced on mobile)
                const burstCount = isSmall ? 8 : 14;
                for (let i = 0; i < burstCount; i++) {
                    const spark = document.createElement('div');
                    spark.textContent = ['✨','💖','🌸','⭐','💕','💗'][Math.floor(Math.random()*6)];
                    spark.style.position = 'fixed';
                    spark.style.left = (Math.random() * 100) + '%';
                    spark.style.top = (Math.random() * 100) + '%';
                    spark.style.fontSize = (1.2 + Math.random() * 1.8) + 'rem';
                    spark.style.pointerEvents = 'none';
                    spark.style.zIndex = '999';
                    spark.style.opacity = '0.9';
                    spark.style.animation = `popIn 0.8s forwards`;
                    spark.style.willChange = 'transform, opacity';
                    document.body.appendChild(spark);
                    setTimeout(() => spark.remove(), 1200);
                }
            });

            // Prevent double-tap zoom on buttons (iOS)
            let lastTouchEnd = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    e.preventDefault();
                }
                lastTouchEnd = now;
            }, { passive: false });

            // Prevent pull-to-refresh overscroll on the body
            document.body.addEventListener('touchmove', (e) => {
                if (e.target === document.body) {
                    e.preventDefault();
                }
            }, { passive: false });

        })();
    </script>
</body>
</html>
